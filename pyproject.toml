[project]
name = "evaluation-dev-test"
version = "0.1.0"
description = "Junior Software Engineer Day 1 Assignment"
authors = [
    {name = "Fernando Djingga",email = "fernandodjingga21@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (==2.31.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pymongo (>=4.18.1,<5.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
